spring.application.name=booking-service

# PostgreSQL Datenbank für Booking-Daten
spring.datasource.url=jdbc:postgresql://localhost:5432/booking-service
spring.datasource.username=julius.kraemer
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Konfiguration (muss mit Auth-Service übereinstimmen)
app.jwt.secret=L1QNdQ-Bp_KB5HlIWockaJ2Y6D-SByKPs6kWFFLWrEgXYZ
app.jwt.expiration-ms=86400000

# RabbitMQ für asynchrone Kommunikation mit Ride-Offer-Service
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Exchanges & Queues Konfiguration
app.rabbitmq.exchange.name=ride-offer-exchange
app.rabbitmq.queue.booking=booking-queue
app.rabbitmq.routing.key.booking=booking.routing

# Port
server.port=8082

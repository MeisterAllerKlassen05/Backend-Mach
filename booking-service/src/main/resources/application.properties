spring.application.name=booking-service

# RabbitMQ für asynchrone Kommunikation mit Auth-Service
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Port für den Booking-Service
server.port=8082

# PostgreSQL Datenbank
spring.datasource.url=jdbc:postgresql://localhost:5432/booking-service?currentSchema=public
spring.datasource.username=julius.kraemer
spring.datasource.password=
spring.datasource.driver-class-name=org.springframework.jdbc.datasource.DriverManagerDataSource
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.application.name=auth-service

# PostgreSQL Datenbank für Auth-Daten
spring.datasource.url=jdbc:postgresql://localhost:5432/auth-service?currentSchema=public
spring.datasource.username=julius.kraemer
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Konfiguration (JWT secret darf hier stehen!)
app.jwt.secret=L1QNdQ-Bp_KB5HlIWockaJ2Y6D-SByKPs6kWFFLWrEgXYZ
